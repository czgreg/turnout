# Turnout · 道岔网关 —— 示例配置
#
# 复制为 gateway.yaml 并编辑。部署到旁挂机的 /etc/turnout/gateway.yaml。
# 本文件相对上游 leap-gateway 的 schema 差异，逐项标注了 [新] / [改] / [不变]。
#
# ⚠️ 硬规则（继承自上游 CLAUDE.md）：
#   `subscriptions:` 块是运维私有资产，各节点刻意不同（地域/合同/成本）。
#   任何配置同步、schema 迁移、yaml 拼接，都**不得**增删改重排其中的条目。
#   迁移时必须把目标节点的 subscriptions: 块原样拼回。

api:
  # [不变] 18080。沿用上游默认端口，省得改文档与部署脚本。
  # 默认只监听本机；需要远程访问改 "0.0.0.0:18080"，并且**必须**配 token。
  listen: "127.0.0.1:18080"
  # token: "change-me"

subscribe:
  # [不变] 0 = 关闭周期刷新，只接受 POST /api/subscribe/refresh 手动触发。
  # 必须是 duration 字符串，裸 0 会 unmarshal 失败。
  refresh_interval: 0s
  refresh_on_startup: true
  http_timeout: 30s
  user_agent: "ClashforWindows/0.20.39"

# [不变] 至少一个订阅。format: auto | clash | singbox | uri | sip008
subscriptions:
  - name: "main"
    url: "https://example.com/your/subscription/url"
    format: "auto"
    enabled: true

# ─────────────────────────────────────────────────────────────
# 旁挂角色定义 —— 本节点全部改动集中在这一块
# ─────────────────────────────────────────────────────────────
node:
  # [改] 上游的 VPN 客户端池 → 办公网网段。这是 PBR 引流过来、需要判定的源地址范围。
  # 必须与防火墙上 PBR 规则的 source-address 一致。
  client_subnet: "10.1.0.0/16"

  # [新] 面向防火墙的网卡（收引流、送回程）。替换上游的 tun0。
  # 防火墙上 PBR 的下一跳就指到本机这个网卡的同网段地址。
  ingress_iface: "ens19"

  # [新] 本机在引流网段上的地址。mihomo 的 DNS 服务监听在这个地址的 :53，
  # 替代上游的 node.tun0_gateway_ip。
  ingress_ip: "10.255.255.2"

  # [不变] 出去到机场节点的网卡。mihomo 的代理出站绑定它。
  egress_iface: "ens18"

  # [新] 回程路径。判定为"不翻墙"的流量从这里交还防火墙。
  #
  # 已定方案 B（TPROXY 全量 + mihomo DIRECT 出站），见 PLAN.md P2 决策门。
  # 机制：mihomo 判定为 DIRECT 的流量从其出站走本机默认路由，
  # 而默认路由的下一跳就是防火墙 —— 流量因此原路交回，由防火墙正常转发。
  #
  # 回程是 FORWARD 语义，不打 fwmark，因此**不会**被 TPROXY 二次劫持。
  # 但必须在 nft 侧确认 FORWARD 链没有挂 TPROXY（见 PLAN.md P2 验证项）。
  return:
    # [新] 回程下一跳 —— 指防火墙在同网段的地址。
    # install.sh 据此安装默认路由：ip route replace default via <gateway_ip>。
    gateway_ip: "10.255.255.1"
    # [新] 回程出口接口。方案 B 下回程复用 ingress_iface 即可（留空 = 用 entry 口），
    # 因为回程包由 TPROXY 后的 mihomo 发出，与入向引流是两条独立路径，
    # 不存在防火墙 PBR 二次命中问题 —— 前提是防火墙 PBR 指定了原入接口。
    iface: ""

# ─────────────────────────────────────────────────────────────
# 数据面（mihomo）
# ─────────────────────────────────────────────────────────────
data_plane:
  config_path:    "/var/lib/turnout/mihomo/config.yaml"
  rule_sets_dir:  "/var/lib/turnout/mihomo/rule-sets"
  log_level:      "info"

  clash_api:
    external_controller: "127.0.0.1:9090"
    secret: ""

  # [不变] TUN 块保留但禁用。上游同样只靠 TPROXY —— TUN 的两种 stack 都会把
  # 客户端源 IP 塌缩成 198.18.0.0，per-terminal 就废了。
  tun:
    enabled: false

  # [不变] 必需。TPROXY 监听端口，保留真实客户端源 IP。
  # 方案 B 下同样需要：被选中翻墙的那部分流量仍由 TPROXY 送进 mihomo。
  tproxy_port: 7893

  # ─────────────────────────────────────────────────────────────
  # 分流
  # ─────────────────────────────────────────────────────────────
  route:
    # [不变] whitelist —— 只有白名单命中才翻墙，其余一律直连（交回防火墙）。
    # 这个语义正好满足旁挂需求：规则最后一行 MATCH,DIRECT 就是兜底回程。
    mode: "whitelist"
  
    whitelist:
      # [不变] 域类白名单（geosite 标签）。命中后按 per-terminal 分配到出口。
      geosites:
        - "openai"
        - "anthropic"
        - "github"
        - "google-gemini"
      # [不变] 直接列域名后缀。
      domain_suffix:
        - "claude.ai"
        # ... 按需补
      # [不变] IP 类白名单 —— 硬编码 IP 的应用（Telegram MTProto 等）。
      # 走 no-resolve，**不依赖 DNS**，因此不受 DoH/嗅探失效影响。
      # 方案 B 下这些 CIDR 会被静态灌进 nft 集合，同样不依赖 DNS。
      geoips: []
      ip_cidr: []
        # - "91.108.56.0/22"   # Telegram
  
  # ─────────────────────────────────────────────────────────────
  # DNS —— 旁挂场景下角色变了（见 README §3）
  # ─────────────────────────────────────────────────────────────
  dns:
    # [改] 监听地址由 node.ingress_ip 决定（上游绑 tun0_gateway_ip）。
    # 防火墙上把办公网段的 :53 引流到本机。
    listen: ""            # 留空 = 自动用 node.ingress_ip + ":53"
  
    # redir-host 是代码里写死的（internal/mihomo/dns.go），**没有开关** ——
    # 这里曾经写了一行 enhanced_mode，但 schema 里不存在该字段，一直被静默
    # 忽略。留着只会让人以为能改。办公网里 NAS/打印机/监控/内网业务系统
    # 大量靠纯 IP 或内网域名直连，fake-ip 的 filter 会变成无底洞；上游
    # 2026-07-06 从 fake-ip 切回 redir-host，血泪在此。
  
    # [不变] 国内外 DoH 上游。
    cn_doh:    ["https://doh.pub/dns-query"]
    proxy_doh: ["tls://1.1.1.1:853"]
    bootstrap_resolver: "udp://119.29.29.29"
  
    # [改] 上游的内网后缀 → 办公网内网后缀。这些域走 CN DoH 解析，避免
    # 默认的 proxyDoH（海外）拿不到内网记录。
    #
    # 注意：字段名沿用了上游的 fake_ip_skip_suffixes，但**语义与 fake-ip 无关** ——
    # redir-host 模式下没有 fake-ip 可跳过（见上方 enhanced_mode 注释）。
    # 它当前的唯一作用是喂给 nameserver-policy，让这些内网后缀走 CN DoH。
    # 上游保留了历史命名，本项目同样保留以避免无谓的 schema 变动。
    fake_ip_skip_suffixes:
      - "corp.example.com"
      - "internal.example.com"

# ─────────────────────────────────────────────────────────────
# 出口池 —— [不变] 完全沿用上游
# ─────────────────────────────────────────────────────────────
# node_pattern 属于 data_plane.url_test（它决定哪些机场节点进 us-pool），
# 不是 node_qualify 的字段 —— 见文件上方 data_plane 块。
node_qualify:
  # 只收美国节点，配合机场订阅。
  # （node_pattern 在 data_plane.url_test 下；node_qualify 只管评分阈值。）
  enabled: true

pools:
  # [不变] us-pool 等定义、成员、rule_sets 归属，与上游一致。
  # 详见上游 docs/design-eligibility-set-selection.md。
  []

load_balance:
  # [不变] 一个终端一个出口 IP，避免 Cloudflare / OpenAI 风控。
  per_terminal: true

# ─────────────────────────────────────────────────────────────
# 自检与降级 —— [新] 本项目的核心增量
# ─────────────────────────────────────────────────────────────
#
# 关于下面几个 bool 字段的取值语义：yaml 无法区分「键省略」与「显式 false」，
# 所以凡是**默认应为开**的开关都是指针类型 —— 省略该行 = 用默认值（开），
# 显式写 false 才是关。默认应为关的字段（auto_failover / egress_probe）保持
# 普通 bool，零值即正确。
#
# 这不是洁癖：手写配置时漏掉一行 `engine_alive` 会让该项检查静默失效，
# 而"静默失效的健康检查"正是这个组件要防的东西。
watchdog:
  # 省略 = 开。整个子系统是否运行；另有 liveness_ip 必须非空（见下）。
  enabled: true

  # 自检周期。太短会抖动，太长会延长黑洞窗口。10s 是默认起点。
  interval: "10s"

  # 连续失败多少次才判定为不健康（避免单次抖动就摘地址）。
  fail_threshold: 3
  # 连续成功多少次才恢复（与华为 IP-Link 的 revertive 语义对齐）。
  recover_threshold: 3

  checks:
    # mihomo 进程存活 + clash-api /version 可达。省略 = 开。
    engine_alive: true
    # 数据面规则在位。省略 = 开。
    # ⚠️ 不重复实现 —— 直接消费 internal/dataplane/assert.go 的现有状态。
    # assert.go 每 30s 断言规则并做定点自修复，watchdog 只读它的结论。
    # 两者分工见 CHANGES-FROM-UPSTREAM.md §六。
    dataplane_rules: true
    # 出口池里至少 N 个节点健康（复用 NodeScorer 状态）。
    # 省略 = 1；显式写 0 则关闭该项检查。
    pool_healthy_min: 1
    # 端到端探测：经代理实际取一个 URL。
    # 这是唯一能证明"整条链路真的通"的检查，但会产生真实流量。
    egress_probe: false
    egress_probe_url: "http://cp.cloudflare.com/generate_204"
    egress_probe_timeout: "5s"

  # ───────────────────────────────────────────────────────────
  # 探活地址 —— 防火墙上 IP-Link 的探测目标
  # ───────────────────────────────────────────────────────────
  #
  # ⚠️ 部署时必填，无默认值。install.sh 的 precheck 会拒绝空值。
  #
  # 为什么强制显式配置：这是本机与防火墙之间唯一的健康信号通道，
  # 配错（漏填/填成 ingress_ip/填成别的机器在用的地址）会导致
  # "watchdog 摘了地址但防火墙没感知"或"摘掉地址把 SSH 一起干掉了"，
  # 两种都是静默故障。宁可让部署脚本报错。
  #
  # 必须满足：
  #   1. **独立于 node.ingress_ip** —— 摘掉 ingress_ip 会让 SSH 和 API 一起失联
  #   2. 与防火墙 IP-Link 的 destination 完全一致
  #   3. 不与网段内任何真实设备冲突
  # 建议做法：在 ingress 网段里挑一个空闲地址，绑在 lo 上。
  liveness_ip: ""          # 必填，例如 "10.255.255.3"
  liveness_iface: "lo"     # 默认绑 lo；若防火墙用 arp 模式探测则需绑物理口

  # ───────────────────────────────────────────────────────────
  # 降级动作 —— 决定 watchdog 是只报信，还是真的去摘地址
  # ───────────────────────────────────────────────────────────
  #
  # ⚠️ 建议上线初期保持 false，只告警不动作，观察一到两周真实故障率。
  #
  # 试用期用户少，手动切回足够。自动摘地址在"数据面半死"时会给出
  # 假的安全感（探针说健康、实际黑洞），反而不如没有。
  # 确认故障模式可预期后再置 true。
  #
  # false 时：判定不健康 → 仅推飞书告警，探活地址保持应答
  # true  时：判定不健康 → 摘掉探活地址 → 防火墙 IP-Link Down → PBR 失效 → 回落直连
  auto_failover: false

  # [改] 告警沿用上游飞书通路。
  notify_on_state_change: true

# ─────────────────────────────────────────────────────────────
# 容量基线 —— [不变]
# ─────────────────────────────────────────────────────────────
capacity:
  # 2026-06-07 压测基线（见 memory: stress-baseline-2026-06-07）
  sustained_max_users: 50
  degraded_max_users: 150
